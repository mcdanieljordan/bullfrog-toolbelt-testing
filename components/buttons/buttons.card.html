<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--color-bg);display:flex;flex-direction:column;gap:16px;font-family:var(--font-body);}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button } = window.BullFrogToolbelt;
function App(){
  return (
    <div>
      <div className="row">
        <Button variant="primary" size="sm">Visit Tool</Button>
        <Button variant="primary" size="md">Visit Tool</Button>
        <Button variant="primary" size="lg">Visit Tool</Button>
        <Button variant="primary" disabled>Visit Tool</Button>
      </div>
      <div className="row">
        <Button variant="secondary">Save for later</Button>
        <Button variant="ghost">Cancel</Button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
