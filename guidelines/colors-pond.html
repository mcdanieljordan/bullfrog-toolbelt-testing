<!-- @dsCard group="Colors" viewport="700x180" subtitle="Pond-deep green ramp, header/dark accents" name="Pond Deep Green" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);background:var(--color-bg);}
.row{display:flex;height:70px;border-radius:12px;overflow:hidden;}
.sw{flex:1;display:flex;align-items:flex-end;padding:6px;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);}
.label{font-size:12px;color:var(--color-text-muted);margin-top:8px;}</style></head>
<body>
<div class="row">
<div class="sw" style="background:var(--color-pond-100);color:var(--color-pond-800)">100</div>
<div class="sw" style="background:var(--color-pond-200);color:var(--color-pond-800)">200</div>
<div class="sw" style="background:var(--color-pond-300)">300</div>
<div class="sw" style="background:var(--color-pond-400)">400</div>
<div class="sw" style="background:var(--color-pond-500)">500</div>
<div class="sw" style="background:var(--color-pond-600)">600</div>
<div class="sw" style="background:var(--color-pond-700)">700</div>
<div class="sw" style="background:var(--color-pond-800)">800</div>
<div class="sw" style="background:var(--color-pond-900)">900</div>
</div>
<div class="label">--color-pond-* &mdash; base 500 = #1F3D2B, header + dark surfaces</div>
</body></html>
