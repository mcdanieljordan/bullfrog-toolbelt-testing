<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);background:var(--color-bg);}
.row{display:flex;height:70px;border-radius:12px;overflow:hidden;}
.sw{flex:1;display:flex;align-items:flex-end;padding:6px;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);}
.label{font-size:12px;color:var(--color-text-muted);margin-top:8px;}</style></head>
<body>
<div class="row">
<div class="sw" style="background:var(--color-primary-100);color:var(--color-primary-800)">100</div>
<div class="sw" style="background:var(--color-primary-200);color:var(--color-primary-800)">200</div>
<div class="sw" style="background:var(--color-primary-300)">300</div>
<div class="sw" style="background:var(--color-primary-400)">400</div>
<div class="sw" style="background:var(--color-primary-500)">500</div>
<div class="sw" style="background:var(--color-primary-600)">600</div>
<div class="sw" style="background:var(--color-primary-700)">700</div>
<div class="sw" style="background:var(--color-primary-800)">800</div>
<div class="sw" style="background:var(--color-primary-900)">900</div>
</div>
<div class="label">--color-primary-* &mdash; base 500 = #5E9C4A, primary buttons &amp; accents</div>
</body></html>
