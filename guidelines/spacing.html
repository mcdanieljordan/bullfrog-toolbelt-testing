<!-- @dsCard group="Spacing" viewport="700x180" subtitle="4px base spacing scale" name="Spacing Scale" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--color-bg);font-family:var(--font-body);}
.row{display:flex;align-items:flex-end;gap:6px;}
.bar{background:var(--color-primary-500);width:24px;}
.label{font-size:10px;color:var(--color-text-muted);margin-top:4px;text-align:center;}
.col{display:flex;flex-direction:column;align-items:center;}</style></head>
<body>
<div class="row">
<div class="col"><div class="bar" style="height:4px"></div><div class="label">1 / 4px</div></div>
<div class="col"><div class="bar" style="height:8px"></div><div class="label">2 / 8px</div></div>
<div class="col"><div class="bar" style="height:12px"></div><div class="label">3 / 12px</div></div>
<div class="col"><div class="bar" style="height:16px"></div><div class="label">4 / 16px</div></div>
<div class="col"><div class="bar" style="height:24px"></div><div class="label">5 / 24px</div></div>
<div class="col"><div class="bar" style="height:32px"></div><div class="label">6 / 32px</div></div>
<div class="col"><div class="bar" style="height:48px"></div><div class="label">7 / 48px</div></div>
<div class="col"><div class="bar" style="height:64px"></div><div class="label">8 / 64px</div></div>
</div>
</body></html>
