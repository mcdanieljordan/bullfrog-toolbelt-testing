<!-- @dsCard group="Colors" viewport="700x170" subtitle="Mist background + ink text pairing" name="Neutrals — Mist &amp; Ink" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);background:var(--color-bg);}
.pair{display:flex;gap:16px;}
.block{flex:1;height:100px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:18px;border:1px solid var(--color-border);}
.label{font-size:12px;color:var(--color-text-muted);margin-top:8px;}</style></head>
<body>
<div class="pair">
<div class="block" style="background:var(--color-neutral-100);color:var(--color-neutral-900);">Mist #F1F6EF</div>
<div class="block" style="background:var(--color-neutral-900);color:var(--color-neutral-50);border:none;">Ink #20291F</div>
</div>
<div class="label">Page background is always mist; body text is always ink. Never grey these down.</div>
</body></html>
