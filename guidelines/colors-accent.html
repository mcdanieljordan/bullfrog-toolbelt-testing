<!-- @dsCard group="Colors" viewport="700x180" subtitle="Sun yellow ramp, highlights + focus" name="Accent — Sun Yellow" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);background:var(--color-bg);}
.row{display:flex;height:70px;border-radius:12px;overflow:hidden;}
.sw{flex:1;display:flex;align-items:flex-end;padding:6px;font-size:11px;color:var(--color-pond-900);}
.label{font-size:12px;color:var(--color-text-muted);margin-top:8px;}</style></head>
<body>
<div class="row">
<div class="sw" style="background:var(--color-accent-100)">100</div>
<div class="sw" style="background:var(--color-accent-200)">200</div>
<div class="sw" style="background:var(--color-accent-300)">300</div>
<div class="sw" style="background:var(--color-accent-400)">400</div>
<div class="sw" style="background:var(--color-accent-500)">500</div>
<div class="sw" style="background:var(--color-accent-600)">600</div>
<div class="sw" style="background:var(--color-accent-700);color:#fff">700</div>
<div class="sw" style="background:var(--color-accent-800);color:#fff">800</div>
<div class="sw" style="background:var(--color-accent-900);color:#fff">900</div>
</div>
<div class="label">--color-accent-* &mdash; base 500 = #F4B93E, badges, highlights, focus rings</div>
</body></html>
