<!-- @dsCard group="Colors" viewport="700x180" subtitle="Mud brown ramp, secondary accent" name="Secondary — Mud Brown" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);background:var(--color-bg);}
.row{display:flex;height:70px;border-radius:12px;overflow:hidden;}
.sw{flex:1;display:flex;align-items:flex-end;padding:6px;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);}
.label{font-size:12px;color:var(--color-text-muted);margin-top:8px;}</style></head>
<body>
<div class="row">
<div class="sw" style="background:var(--color-secondary-100);color:var(--color-secondary-800)">100</div>
<div class="sw" style="background:var(--color-secondary-200);color:var(--color-secondary-800)">200</div>
<div class="sw" style="background:var(--color-secondary-300);color:var(--color-secondary-800)">300</div>
<div class="sw" style="background:var(--color-secondary-400)">400</div>
<div class="sw" style="background:var(--color-secondary-500)">500</div>
<div class="sw" style="background:var(--color-secondary-600)">600</div>
<div class="sw" style="background:var(--color-secondary-700)">700</div>
<div class="sw" style="background:var(--color-secondary-800)">800</div>
<div class="sw" style="background:var(--color-secondary-900)">900</div>
</div>
<div class="label">--color-secondary-* &mdash; base 500 = #8A6339, secondary accents only</div>
</body></html>
